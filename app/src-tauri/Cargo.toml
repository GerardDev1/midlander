[package]
name = "midlander"
version = "0.1.0"
description = "Midlander: a desktop screenwriting application"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[lib]
name = "midlander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
